{% load static %}

  <a href="/{{ message.id }}/" class="message_container">

    <img class="message_avatar" src="{% static "images/icons8-utilisateur-100.png" %}" alt="{{ request.user.username }}">
    <div >
        <div class="message-header">
            <div class="message-username">{{ message.user.username }}</div>
            <div class="message-created_at">{{ message.created_at }}</div>
        </div>
        <div class="message-content">{{ message.content }}</div>
    </div>
  </a>
  <hr />
